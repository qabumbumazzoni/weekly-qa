<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA System Mazzoni</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182a39;font:14px system-ui,sans-serif}aside{position:fixed;width:224px;height:100vh;background:#102e35;color:#e9f4f2;padding:32px 22px}.logo{font-size:32px;font-weight:850;color:#6ce0b9;display:flex;align-items:center;gap:12px}.logo span{font-size:19px;letter-spacing:2px;color:white}small{font-size:10px;letter-spacing:1.4px;color:#738891}aside>small{display:block;margin:18px 0 40px;color:#91b4b5}nav button{width:100%;text-align:left;background:none;color:#b6ced0;border:0;padding:15px 12px;margin:4px 0}nav button.active{background:#245057;color:white;border-left:3px solid #72e5bc}.sidefoot{position:absolute;bottom:35px;font-size:11px;line-height:2}.sidefoot small{letter-spacing:0}main{margin-left:224px;padding:32px 38px;max-width:1800px}header,.toolbar,.row{display:flex;align-items:center;gap:12px}header{justify-content:space-between;margin-bottom:26px}h1{font-size:28px;letter-spacing:-1px;margin:7px 0}h2{font-size:18px;margin:0 0 18px}h3{margin:0 0 12px;font-size:15px}.save{color:#23866b;font-size:12px}button,input,select,textarea{font:inherit;border:1px solid #d8e1e5;border-radius:7px;padding:10px 12px;background:white;color:inherit}button{cursor:pointer}button:hover{filter:brightness(.96)}button.primary{background:#166b5c;color:white;border-color:#166b5c}label{display:grid;gap:6px;font-size:12px;color:#60727e}textarea{min-height:95px;resize:vertical}input,select,textarea{min-width:0}button.danger{color:#b54242}.toolbar{padding:16px 0 24px}.spacer{flex:1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #e1e7eb;border-radius:12px;padding:22px}.card strong{display:block;font-size:32px;margin:13px 0 5px}.muted{color:#7c8d98;font-size:12px}.grid{display:grid;grid-templa </style><body><aside><div class="logo">M<span>MAZZONI</span></div><small>QUALITY ASSURANCE</small><nav><button data-tab="dashboard">◫ Dashboard</button><button data-tab="tasks">☑ Weekly To-Do</button><button data-tab="meetings">▤ Weekly Meeting</button><button data-tab="data">⇄ Data & Panduan</button></nav><div class="sidefoot">QA SYSTEM<br><small>Rencana jelas. Tindak lanjut tuntas.</small></div></aside><main><header><div><small>WORKSPACE / QA SYSTEM</small><h1 id="heading">Overview mingguan</h1></div><div class="save" id="saved">● Tersimpan di browser</div></header><section class="toolbar"><div><label>Minggu mulai (Senin)<input id="week" type="date"></label></div><button id="prev">←</button><button id="next">→</button><span class="spacer"></span><button id="carry">↪ Carry-over ke minggu ini</button><button class="primary" id="add">+ Tugas baru</button></section><div id="content"></div><footer>QA System Mazzoni · Data tersimpan pada browser/perangkat ini · Ekspor berkala untuk cadangan</footer></main><dialog id="modal"><form id="form"></form></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='mazzoni-qa-v1', cats=['QMS & Dokumentasi','Audit','CAPA & Improvement','Quality Control','Supplier Quality','Training','Lainnya'], statuses=['Belum mulai','Dikerjakan','Terhambat','Selesai'];
const date=d=>{let x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}, monday=d=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return date(x)}, shift=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return date(x)}, uid=()=>crypto.randomUUID();
let db={version:1,tasks:[],meetings:[],categories:cats}, tab='dashboard', filters={q:'',owner:'',status:'',cat:'',priority:'',carry:false};
try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tasks)&&Array.isArray(d.meetings))db=d}catch(e){alert('Data browser tidak dapat dibaca. Impor cadangan bila tersedia.')}
$('#week').value=monday(date(new Date()));
const week=()=>$('#week').value, tasks=()=>db.tasks.filter(t=>t.weeks.includes(week())), meetings=()=>db.meetings.filter(m=>m.week===week()), toast=t=>{let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',3000)};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));$('#saved').textContent='● Tersimpan '+new Date().toLocaleTimeString('id-ID');return true}catch(e){alert('Penyimpanan gagal. Ekspor data sebelum menutup aplikasi.');return false}}
const opts=(arr,v='',all='')=>(all?`<option value="">${all}</option>`:'')+arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const badge=t=>`<span class="badge ${t.status==='Terhambat'?'red':t.status==='Dikerjakan'?'amber':''}">${esc(t.status)}</span>`;
function table(ts){return ts.length?`<div class="tablewrap"><table><thead><tr><th>Tugas / Workstream</th><th>Owner</th><th>Prioritas</th><th>Tenggat</th><th>Status</th></tr></thead><tbody>${ts.map(t=>`<tr><td><button data-task="${t.id}">${esc(t.title)}</button><div class="muted">${esc(t.cat)} ${t.weeks[0]!==week()?'· ↪ Carry-over':''}${t.meetingId?' · Dari rapat':''}</div></td><td>${esc(t.owner)}</td><td><span class="badge ${t.priority==='Tinggi'?'red':''}">${esc(t.priority)}</span></td><td class="${t.due<date(new Date())&&t.status!=='Selesai'?'danger':''}">${esc(t.due)}</td><td>${badge(t)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada tugas untuk minggu ini.<br>Tambahkan tugas atau bawa tugas tertunda dari minggu sebelumnya.</div>'}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#heading').textContent=({dashboard:'Overview mingguan',tasks:'Weekly To-Do List',meetings:'Weekly Meeting',data:'Data & Panduan'})[tab];$('#add').textContent=tab==='meetings'?'+ Meeting baru':'+ Tugas baru';let ts=tasks(),done=ts.filter(t=>t.status==='Selesai').length,pct=ts.length?Math.round(done/ts.length*100):0,late=ts.filter(t=>t.due<date(new Date())&&t.status!=='Selesai');let html='';
if(tab==='dashboard')html=`<div class="cards">${[['PROGRES MINGGU INI',pct+'%',done+' dari '+ts.length+' tugas selesai'],['TUGAS AKTIF',ts.length-done,'Perlu ditindaklanjuti'],['LEWAT TENGGAT',late.length,'Berdasarkan tanggal hari ini'],['CARRY-OVER',ts.filter(t=>t.weeks[0]!==week()).length,'Dibawa dari minggu sebelumnya']].map(a=>`<div class="card"><small>${a[0]}</small><strong>${a[1]}</strong><div class="muted">${a[2]}</div></div>`).join('')}</div><div class="grid"><section class="panel"><div class="row"><h2>Fokus minggu ini</h2><span class="spacer"></span><span class="badge">${ts.length} tugas</span></div>${table(ts.filter(t=>t.status!=='Selesai').sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6))}</section><section class="panel"><h2>Progres per workstream</h2>${db.categories.map(c=>{let a=ts.filter(t=>t.cat===c),n=a.filter(t=>t.status==='Selesai').length;return `<div class="row">${esc(c)}<span class="spacer"></span><span class="muted">${n}/${a.length}</span></div><div class="bar"><i style="width:${a.length?n/a.length*100:0}%"></i></div>`}).join('')}<h3>Weekly Meeting</h3><div class="muted">${meetings().length} notulen pada minggu ini</div></section></div>`;
if(tab==='tasks'){let shown=ts.filter(t=>(!filters.q||(t.title+' '+t.notes).toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.owner||t.owner===filters.owner)&&(!filters.status||t.status===filters.status)&&(!filters.cat||t.cat===filters.cat)&&(!filters.priority||t.priority===filters.priority)&&(!filters.carry||t.weeks[0]!==week()));html=`<section class="panel"><div class="filters"><input id="search" placeholder="Cari tugas atau catatan…" value="${esc(filters.q)}"><select data-filter="owner">${opts([...new Set(ts.map(t=>t.owner))],filters.owner,'Semua owner')}</select><select data-filter="status">${opts(statuses,filters.status,'Semua status')}</select><select data-filter="cat">${opts(db.categories,filters.cat,'Semua workstream')}</select><select data-filter="priority">${opts(['Tinggi','Sedang','Rendah'],filters.priority,'Semua prioritas')}</select><label><input id="onlycarry" type="checkbox" ${filters.carry?'checked':''}>Carry-over saja</label></div><p class="muted">${shown.length} dari ${ts.length} tugas · Klik judul untuk memperbarui</p>${table(shown)}</section>`}
if(tab==='meetings')html=`<div class="notice">Action item yang disimpan otomatis menjadi tugas. Owner/PIC dan due date mengikuti action item; status dikelola melalui Weekly To-Do. Pilih minggu di atas untuk membuka riwayat notulen.</div><div class="filters"><input id="meetingsearch" placeholder="Cari seluruh riwayat notulen…"><button id="print">Cetak / PDF minggu ini</button></div><div id="meetinglist">${meetingList(meetings())}</div>`;
if(tab==='data')html=`<section class="panel"><h2>Data Anda, tetap tersimpan</h2><p>Perubahan otomatis disimpan di browser ini. Data tidak disinkronkan antarperangkat atau anggota tim. Gunakan ekspor JSON untuk cadangan dan pemindahan data.</p><div class="row"><button class="primary" id="export">Ekspor cadangan JSON</button><button id="import">Impor cadangan JSON</button><button id="csv">Ekspor tugas CSV</button><input hidden type="file" accept=".json" id="file"></div><h2 style="margin-top:32px">Workstream QA</h2><p class="muted">Kategori awal adalah template umum, bukan data atau standar internal Mazzoni.</p><div class="row"><input id="newcat" placeholder="Nama workstream baru"><button id="catadd">+ Tambah</button></div><p>${db.categories.map(esc).join(' · ')}</p><h2 style="margin-top:30px">Cara menggunakan</h2><ol><li>Pilih tanggal pada minggu yang ingin dikelola; tanggal dinormalisasi ke Senin.</li><li>Buat tugas dengan owner, prioritas, due date, workstream dan status. Klik judul untuk mengedit.</li><li>Buat weekly review; isi PIC, progress & evidence, gap / kendala, prioritas minggu depan, keputusan manajemen dan action items. Setiap action item wajib memiliki PIC dan due date.</li><li>Simpan meeting untuk membuat tugas terkait secara otomatis. Perubahan action item memperbarui tugas yang sama tanpa duplikasi.</li><li>Pada minggu baru, klik Carry-over untuk membawa semua tugas belum selesai dari minggu sebelumnya. Due date asli tetap dipertahankan.</li><li>Buka minggu terdahulu untuk membaca notulen. Riwayat tugas menampilkan status terbaru, bukan snapshot status masa lalu.</li><li>Ekspor cadangan berkala. Impor JSON menggabungkan record berdasarkan ID; record dengan ID sama diperbarui.</li></ol><div class="notice">Tidak ada lampiran notulen pada percakapan rujukan yang dapat diakses. Notulen lama dapat dimasukkan melalui formulir meeting. Impor hanya menerima cadangan JSON aplikasi ini.</div></section>`;
$('#content').innerHTML=html;bind()}
function meetingList(ms){return ms.length?ms.sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<section class="panel meeting"><div class="row"><div><small>WEEKLY REVIEW</small><h2 style="margin-top:8px">QA SYSTEM MAZZONI – WEEKLY REVIEW</h2></div><span class="spacer"></span><button data-meeting="${m.id}">Edit notulen</button></div><div class="review-meta"><div><strong>Minggu:</strong> ${esc(m.week)} – ${esc(shift(m.week,6))}</div><div><strong>PIC:</strong> ${esc(m.chair)}</div></div>${[['PROGRESS & EVIDENCE',m.progress],['GAP / KENDALA',m.gaps],['PRIORITAS MINGGU DEPAN',m.nextPriorities],['KEPUTUSAN MANAJEMEN',m.decisions]].map(a=>`<div class="item"><h3>${a[0]}</h3><p>${esc(a[1]||'—')}</p></div>`).join('')}${(m.agenda||m.discussion)?`<details class="item"><summary>Catatan format sebelumnya</summary><h3>Agenda</h3><p>${esc(m.agenda)}</p><h3>Pembahasan</h3><p>${esc(m.discussion)}</p></details>`:""}<div class="item action-items"><h3>Action items</h3>${db.tasks.filter(t=>t.meetingId===m.id).map(t=>`<p><button data-task="${t.id}">${esc(t.title)}</button> · ${esc(t.owner)} · ${esc(t.due)} ${badge(t)}</p>`).join('')||'<span class="muted">Belum ada action item</span>'}</div></section>`).join(''):'<div class="panel empty">Belum ada notulen. Buat meeting pertama untuk minggu ini.</div>'}
function field(label,name,value='',type='text',full=false){return `<label class="${full?'full':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" required></label>`}function select(label,name,arr,val){return `<label>${label}<select name="${name}">${opts(arr,val)}</select></label>`}function area(label,name,val){return `<label class="full">${label}<textarea name="${name}">${esc(val||'')}</textarea></label>`}
function openTask(id){let t=db.tasks.find(t=>t.id===id)||{priority:'Sedang',status:'Belum mulai',due:shift(week(),4),cat:db.categories[0]};$('#form').innerHTML=`<h2>${id?'Detail tugas':'Tugas baru'}</h2><div class="fields">${field('Judul tugas','title',t.title,'text',true)}${field('Owner / PIC','owner',t.owner)}${field('Due date','due',t.due,'date')}${select('Prioritas','priority',['Tinggi','Sedang','Rendah'],t.priority)}${select('Status','status',statuses,t.status)}${select('Workstream QA','cat',db.categories,t.cat)}${area('Catatan / bukti penyelesaian','notes',t.notes)}</div><div class="actions">${id&&!t.meetingId?'<button type="button" id="delete" class="danger">Hapus tugas</button>':''}<button type="button" id="cancel">Batal</button><button class="primary">Simpan tugas</button></div>`;$('#form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(!v.title.trim()||!v.owner.trim())return;Object.assign(t,v);if(!id){t.id=uid();t.weeks=[week()];db.tasks.push(t)}persist();$('#modal').close();render();toast('Tugas disimpan')};$('#cancel').onclick=()=>$('#modal').close();if($('#delete'))$('#delete').onclick=()=>{if(confirm('Hapus tugas ini dari seluruh minggu?')){db.tasks=db.tasks.filter(x=>x.id!==id);persist();$('#modal').close();render()}};$('#modal').showModal()}
function openMeeting(id){let m={...(db.meetings.find(m=>m.id===id)||{date:week()})},acts=db.tasks.filter(t=>t.meetingId===id&&id);$('#form').innerHTML=`<h2>QA SYSTEM MAZZONI – WEEKLY REVIEW</h2><div class="fields">${field('Minggu (tanggal mulai)','date',m.week||m.date,'date')}${field('PIC','chair',m.chair)}${area('PROGRESS & EVIDENCE','progress',m.progress)}${area('GAP / KENDALA','gaps',m.gaps)}${area('PRIORITAS MINGGU DEPAN','nextPriorities',m.nextPriorities)}${area('KEPUTUSAN MANAJEMEN','decisions',m.decisions)}</div><h3 style="margin-top:22px">Action items → Weekly To-Do</h3><p class="muted">Judul tindakan · PIC · Due date. Workstream awal: ${esc(db.categories[0])}.</p><div id="actionrows"></div><button type="button" id="actionadd">+ Action item</button><div class="actions"><button type="button" id="cancel">Batal</button><button class="primary">Simpan notulen & tugas</button></div>`;
function add(a={}){let r=document.createElement('div');r.className='actionrow';r.dataset.id=a.id||uid();r.innerHTML=`<input aria-label="Judul action item" placeholder="Tindakan" value="${esc(a.title)}" required><input aria-label="PIC" placeholder="PIC" value="${esc(a.owner)}" required><input aria-label="Due date" type="date" value="${esc(a.due||shift(week(),4))}" required><button type="button" aria-label="Hapus action item">×</button>`;r.querySelector('button').onclick=()=>r.remove();$('#actionrows').append(r)}acts.forEach(add);$('#actionadd').onclick=()=>add();$('#cancel').onclick=()=>$('#modal').close();$('#form').onsubmit=e=>{e.preventDefault();let rows=[...document.querySelectorAll('.actionrow')];if(rows.some(r=>[...r.querySelectorAll('input')].some(i=>!i.value.trim())))return;let v=Object.fromEntries(new FormData(e.target));Object.assign(m,v);m.title='QA SYSTEM MAZZONI – WEEKLY REVIEW';m.people??='';m.agenda??='';m.discussion??='';if(!id)m.id=uid();m.week=monday(m.date);let ids=rows.map(r=>r.dataset.id);let removed=acts.filter(a=>!ids.includes(a.id));if(removed.length&&!confirm('Action item yang dihapus akan tetap disimpan sebagai tugas mandiri. Lanjutkan?'))return;if(id)db.meetings=db.meetings.map(x=>x.id===id?m:x);else db.meetings.push(m);removed.forEach(a=>delete a.meetingId);rows.forEach(r=>{let [title,owner,due]=[...r.querySelectorAll('input')].map(i=>i.value.trim());let t=db.tasks.find(t=>t.id===r.dataset.id);if(!t){t={id:r.dataset.id,status:'Belum mulai',priority:'Sedang',cat:db.categories[0],notes:'',weeks:[m.week]};db.tasks.push(t)}Object.assign(t,{title,owner,due,meetingId:m.id});if(!t.weeks.includes(m.week))t.weeks.push(m.week)});persist();$('#week').value=m.week;$('#modal').close();render();toast('Notulen dan action items tersimpan')};$('#modal').showModal()}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function valid(d){return d?.version===1&&Array.isArray(d.categories)&&d.categories.length>0&&d.categories.every(x=>typeof x==='string'&&x.trim())&&Array.isArray(d.tasks)&&Array.isArray(d.meetings)&&d.tasks.every(t=>['id','title','owner','due','status','priority','cat'].every(k=>typeof t[k]==='string')&&statuses.includes(t.status)&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&Array.isArray(t.weeks)&&t.weeks.length&&t.weeks.every(w=>/^\d{4}-\d{2}-\d{2}$/.test(w)))&&d.meetings.every(m=>['id','title','date','week','chair','people','agenda','discussion','decisions'].every(k=>typeof m[k]==='string')&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)&&/^\d{4}-\d{2}-\d{2}$/.test(m.week))}
function bind(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>openTask(b.dataset.task));document.querySelectorAll('[data-meeting]').forEach(b=>b.onclick=()=>openMeeting(b.dataset.meeting));document.querySelectorAll('[data-filter]').forEach(b=>b.onchange=()=>{filters[b.dataset.filter]=b.value;render()});if($('#search'))$('#search').oninput=e=>{filters.q=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#onlycarry'))$('#onlycarry').onchange=e=>{filters.carry=e.target.checked;render()};if($('#meetingsearch'))$('#meetingsearch').oninput=e=>{let q=e.target.value.toLowerCase();$('#meetinglist').innerHTML=meetingList(q?db.meetings.filter(m=>JSON.stringify(m).toLowerCase().includes(q)):meetings());document.querySelectorAll('[data-meeting]').forEach(b=>b.onclick=()=>openMeeting(b.dataset.meeting));document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>openTask(b.dataset.task))};if($('#print'))$('#print').onclick=()=>window.print();if($('#export')){$('#export').onclick=()=>download('mazzoni-qa-'+date(new Date())+'.json',JSON.stringify(db,null,2),'application/json');$('#csv').onclick=()=>{let rows=[['Judul','Owner','Prioritas','Due date','Status','Workstream','Minggu'],...db.tasks.map(t=>[t.title,t.owner,t.priority,t.due,t.status,t.cat,t.weeks.join(';')])];download('qa-tasks.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!valid(d))throw Error('Format cadangan tidak valid');if(!confirm('Gabungkan cadangan? ID yang sama akan diperbarui.'))return;for(let k of ['tasks','meetings'])db[k]=[...new Map([...db[k],...d[k]].map(x=>[x.id,x])).values()];db.categories=[...new Set([...db.categories,...d.categories,...db.tasks.map(t=>t.cat)])];persist();render();toast('Cadangan berhasil diimpor')}catch(e){alert('Impor gagal: '+e.message)}};$('#catadd').onclick=()=>{let c=$('#newcat').value.trim();if(c&&!db.categories.includes(c)){db.categories.push(c);persist();render()}}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#week').onchange=()=>{if(!week())return;$('#week').value=monday(week());render()};$('#prev').onclick=()=>{$('#week').value=shift(week(),-7);render()};$('#next').onclick=()=>{$('#week').value=shift(week(),7);render()};$('#add').onclick=()=>tab==='meetings'?openMeeting():openTask();$('#carry').onclick=()=>{let n=0;db.tasks.forEach(t=>{if(t.status!=='Selesai'&&t.weeks.some(w=>w<week())&&!t.weeks.includes(week())){t.weeks.push(week());n++}});persist();render();toast(n+' tugas dibawa ke minggu ini')};render();
</script></body></html>
